# https://taskfile.dev
version: '3'

tasks:
  meta:list:
    aliases: [default, list, l]
    desc: List all tasks
    cmds:
      - task --list-all

  repo:setup:
    aliases: [setup]
    desc: Setup
    cmds:
      - cd web && task setup
      - cd api && task setup

  repo:nuke:
    aliases: [nuke]
    desc: Nuke the whole repo
    cmds:
      - git clean -fdX
